let currentLang = 'en';

// ==========================================
// 2. LocalStorage Visit Counter
// ==========================================
let visits = parseInt(localStorage.getItem('roulette_visit_count') || '0', 10) + 1;
localStorage.setItem('roulette_visit_count', visits.toString());

function updateVisitCountDisplay() {
    const prefix = TRANSLATIONS[currentLang].visitPrefix;
    document.getElementById('visitCounter').textContent = prefix + visits;
}

// ==========================================
// 3. Web Audio API Full Arrangement: "The Entertainer" (Gentle / Relaxed Tempo)
// ==========================================
let audioCtx = null;
let bgmTimer = null;
let isBgmOn = false;

const N = {
    C4: 261.63, D4: 293.66, DS4: 311.13, E4: 329.63, F4: 349.23, FS4: 369.99, G4: 392.00, GS4: 415.30, A4: 440.00, AS4: 466.16, B4: 493.88,
    C5: 523.25, CS5: 554.37, D5: 587.33, DS5: 622.25, E5: 659.25, F5: 698.46, FS5: 739.99, G5: 783.99, A5: 880.00
};

// Full arrangement with relaxed moderate tempo (~145ms base duration)
const entertainerFullMelody = [
    // --- INTRO ---
    [N.D4, 145], [N.DS4, 145], [N.E4, 145], [N.C5, 290],
    [N.E4, 145], [N.C5, 290], [N.E4, 145], [N.C5, 580],
    [N.C5, 145], [N.D5, 145], [N.DS5, 145], [N.E5, 145],
    [N.C5, 145], [N.D5, 145], [N.E5, 290], [N.B4, 145],
    [N.D5, 290], [N.C5, 580],

    // --- MAIN THEME A ---
    [N.D4, 145], [N.DS4, 145], [N.E4, 145], [N.C5, 290],
    [N.E4, 145], [N.C5, 290], [N.E4, 145], [N.C5, 435],
    [N.A4, 145], [N.G4, 145], [N.FS4, 145], [N.A4, 145],
    [N.C5, 145], [N.E5, 290], [N.D5, 145], [N.C5, 145],
    [N.D5, 580],
    
    [N.D4, 145], [N.DS4, 145], [N.E4, 145], [N.C5, 290],
    [N.E4, 145], [N.C5, 290], [N.E4, 145], [N.C5, 435],
    [N.C5, 145], [N.D5, 145], [N.E5, 145], [N.C5, 145],
    [N.D5, 145], [N.E5, 290], [N.C5, 145], [N.D5, 145],
    [N.C5, 580],

    // --- MAIN THEME B ---
    [N.C5, 145], [N.D5, 145], [N.E5, 290], [N.C5, 145],
    [N.D5, 145], [N.E5, 290], [N.C5, 145], [N.D5, 145],
    [N.E5, 145], [N.F5, 145], [N.F5, 145], [N.E5, 145],
    [N.D5, 145], [N.F5, 145], [N.E5, 290], [N.C5, 145],
    [N.D5, 145], [N.E5, 580],

    [N.D4, 145], [N.DS4, 145], [N.E4, 145], [N.C5, 290],
    [N.E4, 145], [N.C5, 290], [N.E4, 145], [N.C5, 435],
    [N.A4, 145], [N.G4, 145], [N.FS4, 145], [N.A4, 145],
    [N.C5, 145], [N.E5, 290], [N.D5, 145], [N.C5, 145],
    [N.C5, 580],

    // --- CODA / ENDING ---
    [N.C5, 145], [N.E5, 145], [N.G5, 290], [N.G5, 290],
    [N.A5, 290], [N.G5, 290], [N.E5, 290], [N.C5, 290],
    [N.D5, 290], [N.C5, 800]
];

let melodyIndex = 0;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function toggleBGM() {
    initAudio();
    const btn = document.getElementById('bgmBtn');
    isBgmOn = !isBgmOn;

    if (isBgmOn) {
        btn.textContent = "🎵 BGM: ON";
        playEntertainerBGM();
    } else {
        btn.textContent = "🎵 BGM: OFF";
        stopEntertainerBGM();
    }
}

function playEntertainerBGM() {
    if (!audioCtx || !isBgmOn) return;

    try {
        const item = entertainerFullMelody[melodyIndex];
        const freq = item[0];
        const duration = item[1];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + (duration / 1000));

        melodyIndex = (melodyIndex + 1) % entertainerFullMelody.length;
        bgmTimer = setTimeout(playEntertainerBGM, duration);
    } catch (e) {
        // Fallback
    }
}

function stopEntertainerBGM() {
    if (bgmTimer) {
        clearTimeout(bgmTimer);
        bgmTimer = null;
    }
}

function playClickSFX() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) {
        // Fallback
    }
}

        speech.lang = TRANSLATIONS[currentLang].speechLang;
        speech.rate = 1.0;
        speech.pitch = 1.2;
        window.speechSynthesis.speak(speech);
    }
}

function updateMascotMessage(key) {
    const msg = TRANSLATIONS[currentLang][key];
    document.getElementById('mascotSpeech').textContent = msg;
    speakMascotText(msg);

// ==========================================
// 5. European Roulette Core Logic
// ==========================================
const POCKETS = [
    0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
    5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
];

const RED_NUMBERS = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);

const canvas = document.getElementById('roulette');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const statusDiv = document.getElementById('status');
const langSelect = document.getElementById('langSelect');
const bgmBtn = document.getElementById('bgmBtn');

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const outerRadius = 270;
const innerRadius = 150;
const centerRadius = 85;

const ballTargetRadius = 225;
const numberRadius = 180;
const ballRadius = 5.5;

let wheelAngle = 0;
let wheelSpeed = 0;
let isSpinning = false;
let balls = [];

class Ball {
    constructor(targetIndex, delayFrames) {
        this.targetIndex = targetIndex;
        this.delay = delayFrames;
        this.active = false;
        
        this.currentRadius = outerRadius + 15 + Math.random() * 10;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 0.28 + Math.random() * 0.08; 
        
        this.state = 'waiting';
        this.dropProgress = 0;
        this.playedSound = false;
    }

    update(currentWheelAngle) {
        if (this.delay > 0) {
            this.delay--;
            return;
        }
        this.active = true;

        if (this.state === 'waiting') {
            this.state = 'outer';
        }

        const pocketAngleWidth = (Math.PI * 2) / 37;
        const targetAngle = currentWheelAngle + (this.targetIndex + 0.5) * pocketAngleWidth;

        if (this.state === 'outer') {
            this.angle -= this.speed;
            this.speed *= 0.9968;

            if (this.speed < 0.012) {
                this.state = 'dropping';
            }
        } 
        else if (this.state === 'dropping') {
            this.dropProgress += 0.009;

            const angleDiff = Math.atan2(Math.sin(targetAngle - this.angle), Math.cos(targetAngle - this.angle));
            this.angle += angleDiff * 0.08;

            this.currentRadius = outerRadius - (outerRadius - ballTargetRadius) * Math.min(1, this.dropProgress);

            if (this.dropProgress >= 1) {
                this.state = 'locked';
                if (!this.playedSound) {
                    playClickSFX();
                    this.playedSound = true;
                }
            }
        } 
        else if (this.state === 'locked') {
            this.angle = targetAngle;
            this.currentRadius = ballTargetRadius;
        }
    }

    draw() {
        if (!this.active) return;

        const bx = centerX + Math.cos(this.angle) * this.currentRadius;
        const by = centerY + Math.sin(this.angle) * this.currentRadius;

        ctx.save();
        ctx.beginPath();
        ctx.arc(bx, by, ballRadius, 0, Math.PI * 2);
        
        const grad = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, ballRadius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#e0e0e0');
        grad.addColorStop(1, '#888888');
        
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;
        ctx.fill();
        ctx.restore();
    }
}

function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const numPockets = POCKETS.length;
    const arcSize = (Math.PI * 2) / numPockets;

    // Outer rim
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, outerRadius + 20, 0, Math.PI * 2);
    ctx.fillStyle = '#4a2511';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#d4af37';
    ctx.stroke();
    ctx.restore();

    // Pockets
    for (let i = 0; i < numPockets; i++) {
        const angle = wheelAngle + i * arcSize;
        const num = POCKETS[i];

        let color = '#008000';
        if (RED_NUMBERS.has(num)) {
            color = '#d00000';
        } else if (num !== 0) {
            color = '#111111';
        }

        ctx.beginPath();
        ctx.arc(centerX, centerY, outerRadius, angle, angle + arcSize);
        ctx.arc(centerX, centerY, innerRadius, angle + arcSize, angle, true);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(num.toString(), numberRadius, 0);
        ctx.restore();
    }

    // Inner green track
    ctx.beginPath();
    ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#0b3d1b';
    ctx.fill();

    // Balls
    let lockedCount = 0;
    balls.forEach(ball => {
        if (isSpinning) {
            ball.update(wheelAngle);
        }
        ball.draw();
        if (ball.state === 'locked') {
            lockedCount++;
        }
    });

    // Dividers
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#d4af37';
    for (let i = 0; i < numPockets; i++) {
        const angle = wheelAngle + i * arcSize;
        ctx.beginPath();
        ctx.moveTo(centerX + Math.cos(angle) * innerRadius, centerY + Math.sin(angle) * innerRadius);
        ctx.lineTo(centerX + Math.cos(angle) * outerRadius, centerY + Math.sin(angle) * outerRadius);
        ctx.stroke();
    }

    // Concentric rings
    ctx.beginPath();
    ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Metallic hub
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, centerRadius, 0, Math.PI * 2);
    const centerGrad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, centerRadius);
    centerGrad.addColorStop(0, '#ffe066');
    centerGrad.addColorStop(0.7, '#d4af37');
    centerGrad.addColorStop(1, '#8a640f');
    ctx.fillStyle = centerGrad;
    ctx.fill();
    ctx.strokeStyle = '#5c4100';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    if (isSpinning) {
        wheelAngle += wheelSpeed;
        wheelAngle %= Math.PI * 2;

        wheelSpeed = Math.max(0.005, wheelSpeed * 0.9968);

        if (lockedCount === 37) {
            isSpinning = false;
            spinBtn.disabled = false;
            statusDiv.textContent = TRANSLATIONS[currentLang].statusDone;
            updateMascotMessage('mascotDone');
        }
        requestAnimationFrame(drawWheel);
    }
}

// ==========================================
// 6. Interactions
// ==========================================
function updateLanguageUI(langKey) {
    currentLang = langKey;
    const t = TRANSLATIONS[currentLang];

    document.getElementById('appTitle').textContent = t.title;
    spinBtn.textContent = t.spinBtn;
    if (!isSpinning) {
        statusDiv.textContent = t.statusInit;
    } else {
        statusDiv.textContent = t.statusSpinning;
    }
    updateVisitCountDisplay();
}

langSelect.addEventListener('change', (e) => {
    updateLanguageUI(e.target.value);
});

bgmBtn.addEventListener('click', () => {
    toggleBGM();
});

spinBtn.addEventListener('click', () => {
    if (isSpinning) return;

    initAudio();
    isSpinning = true;
    spinBtn.disabled = true;

    wheelSpeed = 0.22;

    statusDiv.textContent = TRANSLATIONS[currentLang].statusSpinning;
    updateMascotMessage('mascotSpinning');

    const targetIndices = Array.from({length: 37}, (_, i) => i);
    for (let i = targetIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [targetIndices[i], targetIndices[j]] = [targetIndices[j], targetIndices[i]];
    }

    balls = targetIndices.map((targetIdx, i) => {
        const delayFrames = i * 12;
        return new Ball(targetIdx, delayFrames);
    });

    requestAnimationFrame(drawWheel);
});

updateLanguageUI('en');
drawWheel();
</script>
